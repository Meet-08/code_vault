services:

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - code-vault-net

  frontend:
    pull_policy: always
    image: meetjbhuva/code-vault-client:latest
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=/api
    environment:
      - INTERNAL_API_URL=http://backend:8080/api
    ports:
      - '3000:3000'
    networks:
      - code-vault-net

  backend:
    pull_policy: always
    image: meetjbhuva/code-vault-server:latest
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - '8080:8080'
    networks:
      - code-vault-net

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=code-vault'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_USER=meet'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - code-vault-net

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - code-vault-net

volumes:
  postgres_data:
  redis_data:

networks:
  code-vault-net:
    driver: bridge
