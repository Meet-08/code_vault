services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=code-vault'
      - 'POSTGRES_PASSWORD=1234'
      - 'POSTGRES_USER=meet'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: